name: Generate dragon
on:
  push: 
  workflow_dispatch:
jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install cowsay
        run: sudo apt-get install cowsay -y

      - name: update file
        run: cowsay -f dragon "Run for cover, I am Dragon" >> dragon.txt

  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Grep file
        run: grep -i dragon dragon.txt

  deploy_job:
    runs-on: ubuntu-latest
    steps:
      - name: Cat file
        run: cat dragon.txt
